[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "binary-alchemist-cyber-toolkit"
version = "0.1.0"
description = "Binary Alchemist Cyber Toolkit - a modular, plugin-based desktop security analysis platform."
readme = "README.md"
requires-python = ">=3.13,<3.15"
license = { text = "MIT" }
authors = [{ name = "Binary Alchemist contributors" }]
keywords = ["security", "ctf", "toolkit", "pyside6", "desktop"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    "pydantic>=2.10,<3",
]

[project.optional-dependencies]
gui = ["PySide6>=6.8,<7"]
network = ["httpx>=0.28,<1", "dnspython>=2.7,<3"]
crypto = ["cryptography>=44"]
file-analysis = ["pefile>=2024.8.26"]
system = ["psutil>=6.1,<8"]
dev = [
    "pytest>=8.3,<10",
    "ruff>=0.9",
    "mypy>=1.14,<3",
    "pyinstaller>=6.11,<7",
]
full = [
    "PySide6>=6.8,<7",
    "httpx>=0.28,<1",
    "dnspython>=2.7,<3",
    "cryptography>=44",
    "pefile>=2024.8.26",
    "psutil>=6.1,<8",
]

[tool.setuptools.packages.find]
include = ["core*", "ui*", "modules*", "infrastructure*"]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["build", "dist", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "C4", "T20"]
# Chinese user-facing strings intentionally use fullwidth punctuation.
ignore = ["RUF001", "RUF002"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["T20"]
"tests/ui/conftest.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
files = ["core", "ui", "app.py", "main.py"]
exclude = ["build", "dist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]
